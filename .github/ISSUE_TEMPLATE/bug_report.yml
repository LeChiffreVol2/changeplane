name: Bug report
description: Report a reproducible defect in ChangePlane Open Source using synthetic data.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities use private reporting in SECURITY.md. Never include private source, tokens, real assessment JSON or customer data."
  - type: input
    id: version
    attributes:
      label: Release version, Node version and OS
      placeholder: "0.4.1, source commit, Node 22.18, Linux"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Commands and minimal synthetic input. Describe the expected and actual outcome.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and redacted error code
      description: Did this block assessment, produce a disputed finding, or affect setup?
