# Reviewed source template only; this file is not directly installable or executable.
# Use the installer, which vendors the release-pinned managed workflow to
# .github/workflows/changeplane.yml. This template is not evidence of a live run.
name: ChangePlane

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
    types: [checks_requested]
  deployment_status:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read
  id-token: write
  pull-requests: write
  statuses: read

jobs:
  guard:
    name: ChangePlane guard
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # One lane per PR: a new head cancels stale evaluation instead of consuming CI in parallel.
      group: changeplane-pr-${{ github.event_name == 'schedule' && 'reconcile' || github.event_name == 'workflow_dispatch' && 'reconcile' || github.event.pull_request.number || github.event.merge_group.head_sha || github.event.deployment.sha || github.run_id }}
      cancel-in-progress: true
    steps:
      # actions/checkout v4.2.2; keep the trusted checkout immutable.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # Never execute code from the untrusted pull-request head with a write token.
          ref: ${{ github.event.merge_group.base_sha || (github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.base.sha) || github.event.repository.default_branch }}
      - name: Bind the trusted default-branch revision
        id: controller
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Evaluate the exact pull-request or queue revision
        uses: ./
        with:
          token: ${{ github.token }}
          trusted_controller_sha: ${{ steps.controller.outputs.sha }}
  reconcile:
    name: ChangePlane guard reconciliation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: changeplane-pr-reconcile
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Bind the trusted default-branch revision
        id: controller
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Reconcile stale App-owned Guards
        uses: ./
        with:
          operation: reconcile
          token: ${{ github.token }}
          trusted_controller_sha: ${{ steps.controller.outputs.sha }}
