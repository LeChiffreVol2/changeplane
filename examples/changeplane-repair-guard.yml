# Inactive controlled-canary template. The setup PR pins the exact ChangePlane release.
name: ChangePlane guard (controlled repair canary)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
    types: [checks_requested]
  deployment_status:
  repository_dispatch:
    types: [changeplane_recheck]

permissions:
  checks: write
  contents: read
  deployments: read
  pull-requests: write

concurrency:
  group: changeplane-guard-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.event.client_payload.pullRequestNumber || github.event.deployment.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Use the pinned Node.js runtime
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0

      - name: Check out the pinned ChangePlane controller
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: LeChiffreVol2/changeplane
          ref: __CHANGEPLANE_RELEASE_SHA__
          path: controller
          persist-credentials: false

      - name: Check out the trusted repository base
        # actions/checkout v4.2.2; never execute pull-request code from this path.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.merge_group.base_sha || (github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.base.sha) || github.event.repository.default_branch }}
          path: trusted-repository
          persist-credentials: false

      - name: Bind the trusted default-branch revision
        id: trusted
        working-directory: trusted-repository
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Evaluate the exact pull-request revision
        if: github.event_name != 'merge_group'
        env:
          INPUT_AGENT_DISPATCH: webhook
          INPUT_AGENT_WEBHOOK_TOKEN: ${{ secrets.CHANGEPLANE_CONTROLLER_HMAC_V12 }}
          INPUT_AGENT_WEBHOOK_URL: "https://changeplane.vercel.app/api/github?action=repair"
          INPUT_CONTROLLER_INSTALLATION_ID: ${{ secrets.CHANGEPLANE_CONTROLLER_INSTALLATION_ID }}
          INPUT_MODE: enforce
          INPUT_POLICY_PATH: .changeplane.json
          INPUT_TOKEN: ${{ github.token }}
          INPUT_TRUSTED_CONTROLLER_SHA: ${{ steps.trusted.outputs.sha }}
        run: node controller/action/index.js

      - name: Evaluate the merge queue without repair authority
        if: github.event_name == 'merge_group'
        env:
          INPUT_AGENT_DISPATCH: none
          INPUT_MODE: enforce
          INPUT_POLICY_PATH: .changeplane.json
          INPUT_TOKEN: ${{ github.token }}
          INPUT_TRUSTED_CONTROLLER_SHA: ${{ steps.trusted.outputs.sha }}
        run: node controller/action/index.js
