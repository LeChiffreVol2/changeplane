name: ChangePlane Open Source

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Open same-repository pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: community-${{ github.event.workflow_run.head_branch || inputs.pull-request }}
  cancel-in-progress: true

jobs:
  assess:
    name: Open Source assessment (advisory)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout, model key, artifacts, write permission or ChangePlane account.
      # Pinned Open Source 0.1.0-alpha.1 implementation; release assets bind the final source SHA.
      - uses: LeChiffreVol2/changeplane/community@fd5d8fcd00292511633d979a4630476df1624dd3
        id: assessment
        with:
          token: ${{ github.token }}
          pull-request: ${{ inputs.pull-request }}
