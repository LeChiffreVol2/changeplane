name: ChangePlane Guard
description: Run the revision-bound assurance harness in Observe, Verify only, or Autonomous profile.
inputs:
  token:
    description: GitHub token used to read pull requests, deployments, and reviewer permissions.
    required: true
  mode:
    description: Observe publishes a neutral receipt. Enforce publishes a blocking-capable exact-head guard and either handoff or bounded repair.
    required: false
    default: observe
  agent_dispatch:
    description: Repair dispatch boundary. none emits a proposal-only coding-agent handback; webhook invokes the separately credentialed repair controller.
    required: false
    default: none
  agent_webhook_url:
    description: Trusted ChangePlane controller endpoint.
    required: false
  agent_webhook_token:
    description: Repository-bound controller authentication secret.
    required: false
  controller_installation_id:
    description: Exact GitHub App installation allowed to authorize this repository.
    required: false
  max_remediation_attempts:
    description: Bounded autonomous repair attempts.
    required: false
    default: "2"
  policy_path:
    description: Repository-relative policy file path (maximum 300 characters) read from the trusted default-branch base revision.
    required: false
    default: .changeplane.json
  trusted_controller_sha:
    description: Exact checked-out default-branch controller revision.
    required: true
  guard_publisher_url:
    description: Fixed ChangePlane production endpoint that exchanges a GitHub OIDC attestation for a dedicated-App guard publication.
    required: false
    default: https://changeplane.vercel.app/api/github?action=guard-publish
outputs:
  mode:
    description: Active harness mode.
  decision:
    description: Exact-head harness result.
  receipt:
    description: Canonical one-line JSON receipt bound to the exact revision and policy digest.
  assurance_passport:
    description: Machine-readable exact-head assurance passport, emitted only after the live GitHub Check is published. Its digest proves local integrity; consumers must still verify that Check and publisher.
  assurance_passport_digest:
    description: Domain-separated SHA-256 digest emitted only after the live exact-head GitHub Check is published.
  proof_locator:
    description: Redacted locator for re-verifying the published guard, evidence, trusted policy, and current GitHub target without carrying authority.
  actual_files:
    description: Number of changed files evaluated.
  finding_count:
    description: Number of scope or protected-path findings.
  agent_handback:
    description: Canonical proposal-only handback JSON bound to the exact pull-request revision, when fixable findings exist.
runs:
  using: node24
  main: action/index.js
